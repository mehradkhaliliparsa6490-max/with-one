<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>چی بپزم؟ | دستیار آشپزی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>🍳 چی بپزم؟</h1>
      <p>با ۳۰۰ غذا و دستور پخت هوشمند، آشپزی را آسان کن!</p>
    </header>

    <!-- پیشنهادات روز -->
    <section class="panel daily-panel">
      <div class="daily-header">
        <h2 class="panel-title">✨ پیشنهادات روز</h2>
        <p class="daily-hint" id="dailyHint">۵ پیشنهاد از ۱۵۰ غذای محبوب — حداکثر ۲ تا انتخاب کن</p>
      </div>
      <div id="dailyCards" class="daily-grid"></div>
      <div class="daily-actions" id="dailyActions">
        <button id="confirmDaily" class="btn btn-primary" disabled>تأیید انتخاب</button>
        <span id="selectedCount" class="daily-count">هنوز چیزی انتخاب نکردی</span>
      </div>
      <div id="selectedIngredients" class="selected-ingredients"></div>
    </section>

    <!-- تب ها -->
    <nav class="main-tabs" aria-label="ناوبری بخش‌ها">
      <button type="button" class="tab-btn active" data-tab="suggest">🍽️ پیشنهاد غذا</button>
      <button type="button" class="tab-btn" data-tab="search">📖 جستجوی غذا</button>
    </nav>

    <!-- بخش پیشنهاد -->
    <section class="tab-panel active" data-panel="suggest">
      <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h2 class="panel-title" style="margin: 0;">🧺 مواد اولیه‌ای که دارم</h2>
          <!-- دکمه جدید انتخاب ۵۰ ماده پرکاربرد -->
          <button id="quick50Btn" class="btn btn-ghost" style="font-size: 0.8rem; padding: 6px 12px;">➕ انتخاب ۵۰ ماده پرکاربرد</button>
        </div>

        <div class="input-row">
          <input id="ingInput" type="text" placeholder="مثلا: پیاز" autocomplete="off" />
          <button id="addBtn" class="btn btn-primary">افزودن</button>
        </div>

        <div id="chips" class="chips"></div>
        <p id="emptyHint" class="hint">مواد خود را وارد کنید...</p>

        <div class="quick">
          <span class="quick-title">پرتکرارها:</span>
          <div id="quickAdd" class="quick-list"></div>
        </div>

        <div class="controls">
          <div class="slider-box">
            <label for="minMatch">حداقل تطابق: <b id="minMatchLabel">40%</b></label>
            <input id="minMatch" type="range" min="0" max="100" step="5" value="40" />
          </div>
          <div class="controls-actions">
            <button id="findBtn" class="btn btn-primary">پیدا کن</button>
            <button id="clearBtn" class="btn btn-ghost">پاک کردن همه</button>
          </div>
        </div>
      </div>

      <section class="filters"><div id="catFilters" class="cat-list"></div></section>
      <section id="results" class="results"></section>
    </section>

    <!-- بخش جستجو -->
    <section class="tab-panel" data-panel="search">
      <div class="panel">
        <h2 class="panel-title">🔍 دنبال دستور یه غذای خاصی؟</h2>
        <div class="input-row">
          <input id="recipeSearch" type="text" placeholder="مثلا: قورمه سبزی" autocomplete="off" />
          <button id="recipeSearchBtn" class="btn btn-primary">جستجو</button>
        </div>
        <div id="recipeSearchResult" class="search-result"></div>
      </div>
    </section>

    <footer class="foot">ساخته‌شده با ❤️</footer>
  </div>

  <script src="ingredients.js"></script>
  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
